<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Видео плеер</title>

    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">

    <link rel="icon" href="favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
}

.player-container {
    width: 800px;
    height: 600px;

    display: flex;
    flex-direction: column;

    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
}

.video-container {
    flex-grow: 1;
}

.controls {
    background: black;

    flex-shrink: 0;

    display: flex;
    align-items: center;

    height: 44px;

    padding-left: 0;
    padding-right: 0;
}

.player-button {
    border: none;
    cursor: pointer;

    background-color: transparent;

    width: 35px;
    height: 32px;

    padding: 0;
}

.player-icon {
    color: white;
    font-size: 17px;
}

.spacer {
    flex-grow: 1;

    display: flex;
    align-items: center;
}

.js-mute-button {
    margin-left: 2px;
}

.js-fullscreen-button {
    margin-right: 1px;
}

.js-fullscreen-button .player-icon {
    font-size: 18px;

    position: relative;
    top: 0;
}

.playback-time {
    color: white;

    font-family: 'Roboto', sans-serif;
    font-weight: 400;
    font-size: 16px;
}

.js-current-time {
    margin-left: 3px;
}

.js-progress {
    position: relative;

    flex-grow: 1;

    height: 5px;

    background: black;

    border-radius: 2px;

    margin: 0 9px;

    display: flex;
    align-items: center;
}

.js-progress-slider {
    height: 100%;
    width: 0%;

    background: red;

    border-radius: 10px;
}

.dot {
    height: 13px;
    width: 13px;

    background-color: red;

    border-radius: 50%;
    border: 3px solid #ffffff;

    box-sizing: border-box;

    position: relative;

    margin-left: -6px;

    transform: translateY(0);

    top: 0;

    opacity: 0;

    transition-property: opacity;
    transition-duration: 300ms;
    transition-timing-function: ease-in-out;
}

.controls:hover .dot {
    opacity: 1;
}
</style>
</head>

<body>

<div id="player" class="player-container">

    <div class="js-video-container video-container"></div>

    <div class="controls">

        <button class="js-play-button player-button">
            <i class="fas fa-play player-icon"></i>
        </button>

        <button class="js-pause-button player-button" hidden>
            <i class="fas fa-pause player-icon"></i>
        </button>

        <button class="js-volume-button player-button" hidden>
            <i class="fas fa-volume-off player-icon"></i>
        </button>

        <button class="js-mute-button player-button">
            <i class="fas fa-volume-up player-icon"></i>
        </button>

        <div class="spacer">

            <div class="playback-time js-current-time">
                0:00
            </div>

            <div class="js-progress">
                <div class="js-progress-slider"></div>
                <span class="dot"></span>
            </div>

            <div class="playback-time js-duration">
                0:00
            </div>

        </div>

        <button class="js-fullscreen-button player-button">
            <i class="fas fa-expand-alt player-icon"></i>
        </button>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>

<script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>

<script src="player.js"></script>

<script>
    createPlayer({
        elementId: 'player'
    });
</script>

</body>
</html>
